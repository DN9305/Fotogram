<!DOCTYPE html>
<html lang="de-en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A fotobook that shows an overview of all images on the front page, all images are clickable to ensure a scaled view on the image.">
    <title>Fotogram</title>
    <link rel="shortcut icon" href="./assets/icons/Group.svg" type="image/x-icon">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/fonts.css">
    <script src="js/db.js" defer></script>
    <script src="js/main.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">
            <a href="./index.html"><img src="./assets/icons/logo.svg" alt="icon"></a>
        </div>
    </header>
    <main>
        <div class="photogallery">
            <h1>My Personal Photo Album</h1>
            <div id="gallery" class="gallery">
            </div>
        </div>
        <dialog id="dialog" class="dialog">
            <div id="dialog-header" class="dialog-header">
                <h2 id="dialog-headline"></h2>
                <button id="dialog-header-button">X</button>
            </div>
            <div id="dialog-img" class="dialog-img">
            </div>
            <div class="dialog-navigation">
                <button id="button-left">
                    << /button>
                        <span id="dialog-span"></span>
                        <button id="button-right">></button>
            </div>
        </dialog>
    </main>
    <footer>
        <div class="impressum">
            <div class="logo-enterprise">
                <img src="./assets/icons/Icon.svg" alt="icon">
                <img src="./assets/icons/Text.svg" alt="icon">
            </div>
            <div class="copyright">
                <span>© 2023 Developer Akademie GmbH</span>
            </div>
        </div>
    </footer>
</body>

</html>
